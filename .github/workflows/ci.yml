name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js (LTS)
      uses: actions/setup-node@v4
      with:
        node-version: '26'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run lint
      run: npm run lint

    - name: Check i18n parity
      run: node scripts/check-i18n-parity.mjs

    - name: Run tests
      run: npm run test

    - name: Build
      run: npm run build
